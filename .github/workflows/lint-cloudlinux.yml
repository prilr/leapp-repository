name: Lint (cloudlinux)

# CloudLinux fork uses the `cloudlinux` branch as trunk; the inherited
# upstream workflows (unit-tests.yml, codespell.yml, etc.) only fire on
# `master` and so do not run on this fork. This narrow workflow guards
# the cloudlinux branch against the most common regression we have hit:
# stray non-ASCII bytes in Python source (em-dashes, smart quotes,
# ellipsis from copy/paste, leftover BOMs).
#
# The checks are `make lint-non-ascii` and `make lint-spec-release`, which
# delegate to utils/check-non-ascii.py and utils/check-spec-release.py.
# Both are also prerequisites of `make lint`, so local developers get the
# identical rules when they run the full lint locally.
#
# lint-spec-release guards the release number the spec declares. Upstream's
# Makefile stamped a computed release over it for COPR scratch builds, using
# an unanchored substring match that corrupted any release ending in 1 -
# 0.20.0-11 was built as 0.20.0-10.<timestamp>.<sha>.HEAD and discarded.
#
# Broader fixes (running the full upstream test+lint matrix on cloudlinux
# PRs) are tracked separately.

on:
  pull_request:
    branches: [cloudlinux]
  push:
    branches: [cloudlinux]

permissions:
  contents: read

jobs:
  lint-non-ascii:
    name: Reject undeclared non-ASCII in Python source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make lint-non-ascii
        run: make lint-non-ascii

  lint-spec-release:
    name: Build must ship the release the spec declares
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make lint-spec-release
        run: make lint-spec-release
